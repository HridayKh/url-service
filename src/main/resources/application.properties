# database
spring.datasource.url=jdbc:mysql://db.hridaykh.in:3306/UrlDB
spring.datasource.username=${URL_DB_USER}
spring.datasource.password=${URL_DB_PASS}
spring.jpa.hibernate.ddl-auto=validate

# oauth
oauth.sign-key=${OAUTH_SIGN_KEY}
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET}
oauth.state-cookie-name=oauth_state
oauth.jwt-cookie-name=jwt
oauth.refresh-token-cookie-name=refreshToken

# domain list
domains.list=urls.hridaykh.in

spring.application.name=url-service
spring.threads.virtual.enabled=true

# --- PRODUCTION/PERFORMANCE MODE ---
spring.thymeleaf.cache=true
spring.web.resources.chain.cache=true
spring.devtools.livereload.enabled=false
# CRITICAL: Debug logging kills 1-vCPU performance
logging.level.root=WARN
logging.level.org.springframework.security.web.FilterChainProxy=WARN

# HikariCP Tuning for 1 vCPU
# Slightly larger pool to handle 200 RPS spikes
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000 

# --- HIBERNATE PERFORMANCE ---
# Stop Hibernate from logging every query to the console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Increase performance for the clickBuffer saves
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# --- WEB & ERROR ---
spring.web.error.whitelabel.enabled=false
# Disable lazy init so the JVM warms up everything at start
spring.main.lazy-initialization=false
