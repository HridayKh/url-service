# database
spring.datasource.url=${URL_DB_URI}
spring.datasource.username=${URL_DB_USER}
spring.datasource.password=${URL_DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=urldb
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# HikariCP
spring.datasource.hikari.jdbc-url=${URL_DB_URI}
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=10

spring.datasource.hikari.maxLifetime=240000 
spring.datasource.hikari.connectionTimeout=5000
spring.datasource.hikari.idleTimeout=120000

spring.datasource.hikari.keepaliveTime=60000
spring.datasource.hikari.leakDetectionThreshold=2000

# oauth
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET}
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
oauth.sign-key=${OAUTH_SIGN_KEY}
oauth.state-cookie-name=oauth_state
oauth.jwt-cookie-name=jwt
oauth.refresh-token-cookie-name=refreshToken

# domain list
domains.list=urls.hridaykh.in

spring.application.name=url-service
spring.threads.virtual.enabled=true

# --- PRODUCTION/PERFORMANCE MODE ---
spring.thymeleaf.cache=true
spring.web.resources.chain.cache=true
spring.devtools.livereload.enabled=false
logging.level.root=WARN
logging.level.org.springframework.security.web.FilterChainProxy=WARN

# --- WEB & ERROR ---
spring.web.error.whitelabel.enabled=false
spring.main.lazy-initialization=false
