<!DOCTYPE html>
<html th:replace="~{fragments/layout :: main-layout(
			~{::short-url-header},
			~{::short-url-main},
			~{::short-url-footer}
		)}">

<!--Buttons on Nav-->
<th:block th:fragment="short-url-header">
	<li><a href="/" role="button">Back</a></li>
	<li><a href="/oauth/logout">Logout</a></li>
	<li><img th:src="${userPfp}" width="50px" loading="lazy" /></li>
</th:block>

<!--Main content-->
<th:block th:fragment="short-url-main">
	<section>
		<h1>
			Generate Short URL
		</h1>
		<th:block th:if="${error}">
			<p th:text="${error}" style="color: red;">
				<strong>Error:</strong> <span th:text="${error}">Something went wrong.</span>
			</p>
		</th:block>
	</section>
	<section id="edit-url-form">
		<div id="edit-url-err"></div>
		<form hx-post="/urls/edit" th:object="${url}" autocomplete="off" hx-tareget="edit-url-err"
			hx-swap="innerHTML">
			<input type="hidden" th:field="*{id}" name="id" required />

			<div role="group">
				<h4>Original URL</h4>
				<input type="url" th:field="*{originalUrl}" required />
			</div>

			<div role="group">
				<h4>Short URL</h4>
				<input type="text" th:field="*{shortUrl}" required />
			</div>
			<fieldset>
				<label>
					<input type="checkbox" th:field="*{hasPassword}"> Use Password?
				</label>
				<div id="passwordContainer" style="display: none;">
					<small>existing password will not be shown</small>
					<input id="password" type="password" name="password"
						placeholder="Enter password" />
				</div>
			</fieldset>

			<select th:field="*{expiryType}" id="expiryType" autocomplete="off">
				<option value="NONE">No Expiry</option>
				<option value="TIME">At Specific Time</option>
				<option value="USAGE">Based on Click Count</option>
				<option value="INACTIVITY">Based on Inactivity</option>
			</select>

			<div id="expiry-TIME" class="expiry-group" style="display: none;">
				<input type="datetime-local" th:field="*{expiryTime}" />
			</div>

			<div id="expiry-USAGE" class="expiry-group" style="display: none;">
				<input type="number" th:field="*{expiryMaxClicks}" />
			</div>

			<div id="expiry-INACTIVITY" class="expiry-group" style="display: none;">
				<input type="number" th:field="*{expiryInactivityDurationDays}" />
			</div>

			<input type="submit" value="Save" />
		</form>
	</section>
</th:block>

<!--Footer Content-->
<th:block th:fragment="short-url-footer">
	<script>
		const initFormLogic = () => {
			// 1. Password Toggle Logic
			const passCheckbox = document.getElementById('hasPassword1') || document.getElementById('hasPassword');
			const passContainer = document.getElementById('passwordContainer');
			const passInput = document.getElementById('password');

			const togglePasswordVisibility = () => {
				console.log('Toggling password visibility. ', passCheckbox && passContainer);
				if (passCheckbox && passContainer) {
					passContainer.style.display = passCheckbox.checked ? 'block' : 'none';
					if (!passCheckbox.checked && passInput) passInput.value = '';
				}
			};

			// 2. Expiry Type Logic
			const expirySelect = document.getElementById('expiryType');
			const expiryGroups = document.querySelectorAll('.expiry-group');

			const updateExpiryVisibility = () => {
				if (!expirySelect) return;

				// Hide all groups first
				expiryGroups.forEach(group => group.style.display = 'none');

				// Show the one that matches the value (e.g., expiry-TIME)
				const targetId = 'expiry-' + expirySelect.value;
				const targetGroup = document.getElementById(targetId);
				if (targetGroup) {
					targetGroup.style.display = 'block';
				}
			};

			// --- Event Listeners ---
			if (passCheckbox) {
				passCheckbox.addEventListener('change', togglePasswordVisibility);
			}

			if (expirySelect) {
				expirySelect.addEventListener('change', updateExpiryVisibility);
			}

			// --- Run once on init to handle Pre-populated Data ---
			togglePasswordVisibility();
			updateExpiryVisibility();
		};

		// Run on standard page load
		document.addEventListener('DOMContentLoaded', initFormLogic);

		// Run if HTMX swaps this content in dynamically
		document.body.addEventListener('htmx:afterSwap', function (evt) {
			initFormLogic();
		});
	</script>
</th:block>

</html>
