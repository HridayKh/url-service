<div id="shorten-url-result">
	<section id="error-container" th:if="${errorMessage}" class="error-section">
		<strong>Error:</strong> <span th:text="${errorMessage}">Something went wrong.</span>
	</section>

	<th:block th:if="${errorMessage == null}">
		<section id="shorten-url-output">
			<p>
				<a th:href="${shortenedUrlLink}" class="text-sz-2">
					<i><strong th:text="${shortenedUrlDisplay}">URL PLACEHOLDER</strong></i>
				</a>
				<br />
				<small>
					<a href="/login">Login</a> or <a href="/register">Register</a>
					to customize the short url.
					<br />
					<sub>
						Generated url will expire after 365 days of no usage,
						<a href="/login">Login</a> or <a href="/register">Register</a>
						to change that!
					</sub>
				</small>
			</p>
		</section>

		<section id="qr-code">
			<div class="qr-placeholder" style="border: 1px dashed var(--pico-primary); padding: 20px;">
				<h3>LIVE QR UI</h3>
				<p>Ready for Styling via Query Params</p>
			</div>
		</section>
	</th:block>
</div>
